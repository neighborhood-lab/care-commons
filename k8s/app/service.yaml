# Folk Care Application Service
apiVersion: v1
kind: Service
metadata:
  name: folkcare-app
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: folkcare-app
