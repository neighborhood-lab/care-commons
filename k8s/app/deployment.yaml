# Folk Care Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: folkcare-app
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: folkcare-app
  template:
    metadata:
      labels:
        app: folkcare-app
        app.kubernetes.io/name: folkcare
        app.kubernetes.io/component: app
    spec:
      # Spread pods across nodes for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - folkcare-app
                topologyKey: kubernetes.io/hostname
      containers:
        - name: folkcare
          image: folkcare:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: folkcare-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: folkcare-config
                  key: PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: folkcare-config
                  key: REDIS_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/folkcare"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: SENTRY_DSN
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
