# Folk Care Kustomization
# Use with: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: folkcare

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/hpa.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  # Uncomment to include ingress
  # - ingress.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: folkcare

# Example: Override image for different environments
# images:
#   - name: folkcare
#     newName: ghcr.io/neighborhood-lab/folkcare
#     newTag: v1.0.0
