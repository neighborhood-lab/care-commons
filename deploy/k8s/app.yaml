# Folk Care Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: folkcare-app
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: folkcare
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: folkcare
        app.kubernetes.io/component: app
    spec:
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h folkcare-postgres -p 5432 -U postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: folkcare-secrets
                  key: POSTGRES_PASSWORD
        # Run database migrations
        - name: db-migrate
          image: ghcr.io/neighborhood-lab/folkcare:latest
          command:
            - npm
            - run
            - db:migrate
          envFrom:
            - configMapRef:
                name: folkcare-config
            - secretRef:
                name: folkcare-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@folkcare-postgres:5432/folkcare"
      containers:
        - name: app
          image: ghcr.io/neighborhood-lab/folkcare:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: folkcare-config
            - secretRef:
                name: folkcare-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@folkcare-postgres:5432/folkcare"
            - name: REDIS_URL
              value: "redis://folkcare-redis:6379"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
---
# Application Service
apiVersion: v1
kind: Service
metadata:
  name: folkcare-app
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: app
