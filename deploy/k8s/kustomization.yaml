# Folk Care Kubernetes Kustomization
# Deploy with: kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: folkcare

namespace: folkcare

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - app.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - backup-cronjob.yaml

commonLabels:
  app.kubernetes.io/name: folkcare
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/neighborhood-lab/folkcare
    newTag: latest
