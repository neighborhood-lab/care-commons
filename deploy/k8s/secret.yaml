# Folk Care Secrets Template
# NOTE: Replace placeholders with base64-encoded values before applying
# Generate with: echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: folkcare-secrets
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
type: Opaque
data:
  # REQUIRED: Generate with: openssl rand -base64 32 | base64
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_JWT_SECRET"
  # REQUIRED: PostgreSQL password
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_PASSWORD"
  # OPTIONAL: Anthropic API key for AI features
  ANTHROPIC_API_KEY: ""
  # OPTIONAL: Resend API key for email notifications
  RESEND_API_KEY: ""
---
# PostgreSQL credentials for StatefulSet
apiVersion: v1
kind: Secret
metadata:
  name: folkcare-postgres-secrets
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: postgres
type: Opaque
data:
  POSTGRES_USER: "cG9zdGdyZXM=" # postgres
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_PASSWORD"
