# Gitleaks configuration for Folk Care
# https://github.com/gitleaks/gitleaks

title = "Folk Care Secrets Scanning"

[extend]
# Use default Gitleaks rules as base
useDefault = true

[allowlist]
description = "Allowlisted files and patterns"

# Ignore test files with placeholder secrets
paths = [
  '''.*test\.ts$''',
  '''.*test\.tsx$''',
  '''.*\.test\.js$''',
  '''.*\.spec\.ts$''',
  '''.*/fixtures/.*''',
  '''.*/mocks/.*''',
  '''.*/__tests__/.*''',
]

# Ignore example/template files
regexes = [
  '''\.env\.example''',
  '''\.env\.template''',
  '''example.*password.*''',
  '''demo.*token.*''',
  '''placeholder.*key.*''',
]

# Ignore documentation
[allowlist.paths]
paths = [
  '''README\.md''',
  '''CLAUDE\.md''',
  '''AGENTS\.md''',
  '''docs/.*''',
]

# Ignore specific false positive patterns
[allowlist.regexes]
regexes = [
  # Example tokens in documentation
  '''ghp_example.*''',
  '''sk-example.*''',

  # Test/demo database URLs
  '''postgresql://postgres:postgres@localhost''',
  '''DATABASE_URL_TEST''',
  '''DATABASE_URL_EXAMPLE''',

  # Placeholder API keys in docs
  '''your-api-key-here''',
  '''YOUR_.*_KEY''',
  '''REPLACE_WITH_YOUR_.*''',
]
