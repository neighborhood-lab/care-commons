<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folk Showcase</title>
    <!-- Single Page Apps for GitHub Pages -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script>
      // Store the current URL (including the path) in sessionStorage
      // and then redirect to the base URL. The main app will restore
      // the path from sessionStorage.
      // GitHub Pages SPA workaround - redirect to base path /folkcare/
      sessionStorage.redirect = location.href;
      // Always redirect to the base /folkcare/ path, not just parent directory
      var basePath = '/folkcare/';
      location.replace(location.protocol + '//' + location.host + basePath);
    </script>
  </head>
  <body>
  </body>
</html>
