name: Visual Regression Tests

# Run visual regression tests on PRs that touch showcase code
on:
  pull_request:
    branches: [develop, preview, production]
    paths:
      - 'showcase/**'
      - 'packages/shared-components/**'
      - 'e2e/tests/visual-*.spec.ts'
      - 'e2e/utils/visual-regression.ts'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update baseline screenshots'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'

# Required for PR comments
permissions:
  contents: read
  pull-requests: write

jobs:
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            showcase/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build showcase
        run: |
          cd showcase && npm run build

      - name: Start showcase server
        run: |
          cd showcase && npm run preview &
          sleep 5
        env:
          PORT: 5174

      - name: Run visual regression tests
        id: visual-tests
        if: ${{ !inputs.update_baselines }}
        # continue-on-error until baselines are established
        # Remove this once e2e/tests/visual-showcase.spec.ts-snapshots/ is committed
        continue-on-error: true
        run: |
          SHOWCASE_URL=http://localhost:5174/care-commons npm run test:visual
        env:
          CI: true

      - name: Update baseline screenshots
        if: ${{ inputs.update_baselines }}
        run: |
          SHOWCASE_URL=http://localhost:5174/care-commons npm run test:visual:update
        env:
          CI: true

      - name: Upload diff screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-screenshots
          path: |
            e2e/tests/visual-showcase.spec.ts-snapshots/
            test-results/
          retention-days: 14

      - name: Upload baseline screenshots
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-baselines
          path: e2e/tests/visual-showcase.spec.ts-snapshots/
          retention-days: 30

      - name: Comment PR with visual diff results
        # Only comment if tests actually ran and failed (not on continue-on-error)
        if: failure() && github.event_name == 'pull_request' && steps.visual-tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Visual Regression Test Failed

            UI changes were detected that don't match the baseline screenshots.

            ### What to do:
            1. **If the changes are intentional**: Update the baselines by running:
               \`\`\`bash
               npm run test:visual:update
               \`\`\`
               Then commit the updated snapshots in \`e2e/tests/visual-showcase.spec.ts-snapshots/\`

            2. **If the changes are unintentional**: Review your changes to identify what caused the visual diff.

            ### Artifacts
            - Download the \`visual-diff-screenshots\` artifact to see the differences
            - Each diff image shows: Expected | Actual | Diff

            [View workflow run](../actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Comment PR on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Visual Regression Test Passed

            All showcase pages match their baseline screenshots. No visual regressions detected.

            **Pages tested:** 22 showcase pages + 3 responsive variants
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
